name: Build and Release RamaCraft

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 Executable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 / MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2

      - name: Build with CMake (MinGW)
        shell: msys2 {0}
        run: |
          mkdir build && cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release ..
          ninja

      - name: Package Windows Release
        shell: bash
        run: |
          mkdir -p release-windows
          cp build/ramacraft.exe release-windows/
          # Copy SDL2.dll runtime from MSYS2
          cp /c/msys64/mingw64/bin/SDL2.dll release-windows/
          cp README.md release-windows/
          cd release-windows && 7z a ../ramacraft-windows-x64.zip *

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ramacraft-windows-x64
          path: ramacraft-windows-x64.zip

  build-macos:
    name: Build macOS Universal Binary
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install sdl2

      - name: Build RamaCraft
        run: |
          make -j$(sysctl -n hw.ncpu)

      - name: Package macOS Release
        run: |
          mkdir -p release-macos
          cp bin/ramacraft release-macos/
          cp README.md release-macos/
          tar -czvf ramacraft-macos.tar.gz -C release-macos .

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ramacraft-macos
          path: ramacraft-macos.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ramacraft-windows-x64

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ramacraft-macos

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ramacraft-windows-x64.zip
            ramacraft-macos.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
